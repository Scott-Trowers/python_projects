name: Check PR title

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title follows conventional commits format
        run: |
          title="${{ github.event.pull_request.title }}"
          if ! echo "$title" | grep -qE "^(feat|fix|docs|refactor|style|test|chore|build|perf|ci|revert)(\(.+\))?: .+"; then
            echo "PR title must follow conventional commits: e.g. 'feat: add day 5 hangman'"
            exit 1
          fi
